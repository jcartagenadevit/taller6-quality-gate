name: Quality Gate - React App

on:
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Validar calidad con ESLint
        run: npm run lint

      - name: Compilar aplicación React
        run: npm run build

      - name: Subir carpeta dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: react-dist-build
          path: frontend/dist/
